version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: kaktoos
    main: ./cmd/kaktoos
    binary: kaktoos

    ldflags:
      - -s -w -X main.version={{.Version}}

    env:
      - CGO_ENABLED=0

    goos:
      - linux
      - darwin
      - windows

    goarch:
      - amd64
      - arm64

archives:
  - id: kaktoos
    formats:
      - tar.gz

    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - name: kaktoos
    repository:
      owner: KaktoosLabs
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"

    homepage: https://kaktoos.dev

    description: Git-native, scenario-based API regression testing CLI powered by OpenAPI

    binaries:
      - kaktoos

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  footer: >-

    ---

    Released by GoReleaser.